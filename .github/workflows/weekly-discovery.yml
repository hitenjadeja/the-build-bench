name: Weekly Harness Discovery

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harness-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate discovery coverage
        run: npm run validate:discovery
      - name: Run dry discovery lanes
        run: npm run discover:harnesses
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate published data
        run: npm run validate:data
      - name: Commit refreshed evidence to main
        run: |
          git add work/**
          if git diff --cached --quiet; then
            echo "Discovery evidence is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh harness discovery evidence"
          git pull --rebase origin main
          git push origin HEAD:main
